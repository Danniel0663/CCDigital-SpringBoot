spring.application.name=${APP_NAME:CCDigital}
server.port=${SERVER_PORT:8080}
# Timeout global de sesión por inactividad (5 minutos).
server.servlet.session.timeout=${SERVER_SESSION_TIMEOUT:5m}

# ------------------------------------------------------------------
# MySQL (obligatorio por variable de entorno)
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ------------------------------------------------------------------
# Archivos (FileStorageProperties -> FileStorageService)
# ------------------------------------------------------------------
ccdigital.fs.base-path=${CCDIGITAL_FS_BASE_PATH}

# ------------------------------------------------------------------
# ACA-Py (si otros componentes aún usan acapy.*)
# ------------------------------------------------------------------
acapy.verifier.admin=${ACAPY_VERIFIER_ADMIN_URL}
acapy.holder.admin=${ACAPY_HOLDER_ADMIN_URL}
acapy.cred-def-id=${ACAPY_CRED_DEF_ID}

# Polling (si lo usas en controller/servicio)
acapy.proof.poll-interval-ms=${ACAPY_PROOF_POLL_INTERVAL_MS:1000}
acapy.proof.poll-timeout-ms=${ACAPY_PROOF_POLL_TIMEOUT_MS:20000}

# ------------------------------------------------------------------
# INDY (ConfigurationProperties: ccdigital.indy.*)
# ------------------------------------------------------------------
ccdigital.indy.issuer-admin-url=${INDY_ISSUER_ADMIN_URL:${acapy.verifier.admin}}
ccdigital.indy.holder-admin-url=${INDY_HOLDER_ADMIN_URL:${acapy.holder.admin}}

# "auto" = busca conexión ACTIVE por their_label == holder-label
ccdigital.indy.holder-connection-id=${INDY_HOLDER_CONNECTION_ID:auto}
ccdigital.indy.holder-label=${INDY_HOLDER_LABEL}

ccdigital.indy.cred-def-id=${INDY_CRED_DEF_ID:${acapy.cred-def-id}}
ccdigital.indy.admin-api-key=${INDY_ADMIN_API_KEY:}
# Sincronización del estado de acceso de usuarios hacia ACA-Py (metadata de conexión activa).
ccdigital.indy.user-access-sync-enabled=${INDY_USER_ACCESS_SYNC_ENABLED:true}
ccdigital.indy.user-access-sync-path=${INDY_USER_ACCESS_SYNC_PATH:/connections/{conn_id}/metadata}

# ------------------------------------------------------------------
# External tools - Fabric CLI scripts
# ------------------------------------------------------------------
external-tools.fabric.workdir=${FABRIC_WORKDIR}
external-tools.fabric.node-bin=${FABRIC_NODE_BIN}
external-tools.fabric.list-docs-script=${FABRIC_LIST_DOCS_SCRIPT}
# Script que resuelve una referencia funcional (docId) al bloque real en Fabric.
external-tools.fabric.block-reader-script=${FABRIC_BLOCK_READER_SCRIPT}
# Script que registra eventos de auditoría on-chain (verificación/consulta de documentos).
external-tools.fabric.record-access-script=${FABRIC_RECORD_ACCESS_SCRIPT}
# Script que lista eventos de auditoría on-chain (por persona o global).
external-tools.fabric.list-access-script=${FABRIC_LIST_ACCESS_SCRIPT}

external-tools.fabric.sync-all-script=${FABRIC_SYNC_ALL_SCRIPT}
external-tools.fabric.sync-person-script=${FABRIC_SYNC_PERSON_SCRIPT}

# ------------------------------------------------------------------
# External tools - Indy scripts
# ------------------------------------------------------------------
external-tools.indy.workdir=${INDY_TOOLS_WORKDIR}
external-tools.indy.venv-activate=${INDY_VENV_ACTIVATE}
external-tools.indy.script=${INDY_SCRIPT}

# Timeout global (segundos)
external-tools.default-timeout-seconds=${EXTERNAL_TOOLS_TIMEOUT_SECONDS:180}

# ------------------------------------------------------------------
# Recuperación segura de contraseña (correo + código temporal / OTP)
# - Requiere SMTP válido (Gmail, Office365, etc.)
# - app.security.forgot-password.mail.from debe ser un remitente permitido por el proveedor
# - spring.mail.test-connection=true valida credenciales SMTP al arrancar (útil para diagnóstico)
# ------------------------------------------------------------------
# Recuperación
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}

app.security.forgot-password.mail.from=${FORGOT_PASSWORD_MAIL_FROM}
spring.mail.test-connection=${MAIL_TEST_CONNECTION:true}
