<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Emisores · CCDigital</title>

  <script src="/js/ccdigital-theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/ccdigital.css}">
</head>

<body class="bg-body-tertiary">
<nav class="navbar cc-navbar">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-semibold text-decoration-none cc-brand" th:href="@{/admin/dashboard}">
      <i class="bi bi-shield-lock me-2"></i>CCDigital · Admin
    </a>
    <div class="d-flex align-items-center gap-2">
      <div class="cc-profile-chip"
           th:if="${ccActiveProfileDisplay != null and !#strings.isEmpty(ccActiveProfileDisplay)}">
        <span class="cc-profile-icon">
          <i class="bi" th:classappend="${(ccActiveProfileIcon != null and !#strings.isEmpty(ccActiveProfileIcon)) ? ' ' + ccActiveProfileIcon : ' bi-shield-lock'}"></i>
        </span>
        <span>
          <span class="cc-profile-label" th:text="${ccActiveProfileLabel}">Perfil</span>
          <span class="cc-profile-value" th:text="${ccActiveProfileDisplay}">admin@dominio.com</span>
        </span>
      </div>
      <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/dashboard}"
         data-cc-tour-scope="admin"
         data-cc-tour-step="1"
         data-cc-tour-title="Regresar al dashboard"
         data-cc-tour-body="Este botón te devuelve al panel principal del rol administrador para cambiar a otros módulos."
         data-cc-tour-placement="bottom">
        <i class="bi bi-house"></i> Dashboard
      </a>
      <button type="button" class="btn btn-sm btn-outline-primary" data-cc-open-tutorial="adminIssuersTutorialTour">
        <i class="bi bi-mortarboard me-1"></i>Tutorial
      </button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="cc-card p-4 mb-3"
       data-cc-tour-scope="admin"
       data-cc-tour-step="2"
       data-cc-tour-title="Módulo de emisores"
       data-cc-tour-body="Esta cabecera resume el objetivo del módulo: controlar las entidades emisoras y los tipos de documento que pueden manejar."
       data-cc-tour-placement="bottom">
    <h1 class="h4 mb-1">Emisores</h1>
    <p class="text-muted mb-0">Gestiona emisores y los tipos de documento permitidos.</p>
  </div>

  <div class="cc-card p-3 p-md-4"
       data-cc-tour-scope="admin"
       data-cc-tour-step="3"
       data-cc-tour-title="Listado de emisores"
       data-cc-tour-body="En esta tabla revisas cada emisor y desde Gestionar abres su configuración operativa y sus estadísticas."
       data-cc-tour-placement="top">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th class="cc-col-w-90">ID</th>
          <th>Emisor</th>
          <th class="text-end cc-col-w-160">Docs emitidos</th>
          <th class="text-end cc-col-w-160">Tipos permitidos</th>
          <th class="text-end cc-col-w-170">Acción</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(stats)}">
          <td colspan="5" class="text-center text-muted py-4">
            No hay emisores para mostrar.
          </td>
        </tr>

        <tr th:each="s : ${stats}">
          <td th:text="${s.id}">1</td>
          <td class="fw-semibold" th:text="${s.name}">Emisor</td>
          <td class="text-end" th:text="${s.documentosEmitidos}">0</td>
          <td class="text-end" th:text="${s.tiposDocumento}">0</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary"
               th:href="@{/admin/issuers/{id}(id=${s.id})}">
              <i class="bi bi-gear me-1"></i>Gestionar
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div id="adminIssuersTutorialTour"
     data-cc-tutorial-root
     data-cc-autoshow="false"
     data-cc-tutorial-scope="admin"
     data-cc-tutorial-key="issuers"
     hidden></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/ccdigital-tutorial.js"></script>
</body>
</html>
